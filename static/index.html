<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GSFlix - Watch Movies &amp; TV Shows</title>
    <meta name="description" content="GSFlix — stream trending movies and TV shows instantly. Browse by category, search, and create your personal watchlist.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/index.css">
</head>
<body>

    <!-- Navigation -->
    <nav id="navbar">
        <div class="nav-content">
            <h1 class="logo">GSFLIX</h1>
            <ul class="nav-links">
                <li><a href="#" class="active" data-page="home" id="nav-home">Home</a></li>
                <li><a href="#" data-page="tvshows" id="nav-tvshows">TV Shows</a></li>
                <li><a href="#" data-page="movies" id="nav-movies">Movies</a></li>
                <li><a href="#" data-page="popular" id="nav-popular">New &amp; Popular</a></li>
                <li><a href="#" data-page="mylist" id="nav-mylist">My List</a></li>
            </ul>
        </div>
        <div class="nav-actions">
            <button class="icon-btn" id="search-toggle" aria-label="Search" title="Search">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            </button>
            <div class="profile">
                <img src="https://upload.wikimedia.org/wikipedia/commons/0/0b/Netflix-avatar.png" alt="Profile">
            </div>
        </div>
    </nav>

    <!-- Search Overlay -->
    <div id="search-overlay" class="search-overlay" role="dialog" aria-label="Search">
        <div class="search-overlay-inner">
            <div class="search-bar-wrap">
                <svg class="search-icon-inside" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input type="text" id="search-input" class="search-input" placeholder="Search movies, TV shows…" autocomplete="off" spellcheck="false">
                <button class="search-close-btn" id="search-close" aria-label="Close search">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            <div id="search-results-area" class="search-results-area">
                <div id="search-placeholder" class="search-placeholder">
                    <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    <p>Type to search movies and TV shows</p>
                </div>
                <div id="search-loading" class="search-loading" style="display:none">
                    <div class="search-spinner"></div>
                </div>
                <div id="search-results-grid" class="search-results-grid"></div>
            </div>
        </div>
    </div>

    <!-- Hero Section -->
    <header id="hero">
        <div class="hero-overlay"></div>
        <!-- Clickable area on the banner itself (behind content) -->
        <div id="hero-click-area" class="hero-click-area" aria-label="More info" role="button" tabindex="0"></div>
        <div class="hero-content">
            <h2 id="hero-title">Loading...</h2>
            <p id="hero-desc"></p>
            <div class="hero-meta-row" id="hero-meta-row"></div>
            <div class="hero-buttons">
                <button id="hero-play" class="btn btn-primary">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                    Play
                </button>
                <button id="hero-info" class="btn btn-secondary">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
                    More Info
                </button>
                <button id="hero-add-list" class="btn btn-ghost" title="Add to My List">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    My List
                </button>
            </div>
        </div>
        <!-- Hero dots for rotation -->
        <div id="hero-dots" class="hero-dots"></div>
    </header>

    <!-- Carousels Container -->
    <main id="carousels-container">
        <!-- Dynamically injected rows go here -->
    </main>

    <!-- My List Empty State -->
    <div id="mylist-empty" class="mylist-empty" style="display:none">
        <div class="mylist-empty-inner">
            <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
            <h3>Your list is empty</h3>
            <p>Add movies and TV shows to your list by clicking the bookmark icon on any title.</p>
            <button class="btn btn-primary" id="mylist-browse-btn">Browse Content</button>
        </div>
    </div>

    <!-- ═══ Detail / More Info Modal ═══ -->
    <div id="detail-modal" class="detail-modal" role="dialog" aria-modal="true" aria-label="Title details">
        <div class="detail-modal-backdrop" id="detail-modal-backdrop"></div>
        <div class="detail-modal-card" id="detail-modal-card">

            <!-- Close button -->
            <button class="detail-close-btn" id="detail-close" aria-label="Close">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>

            <!-- Hero / Trailer section -->
            <div class="detail-hero" id="detail-hero">
                <div class="detail-hero-overlay"></div>
                <!-- Trailer iframe (shown when trailer available) -->
                <div class="detail-trailer-wrap" id="detail-trailer-wrap" style="display:none">
                    <iframe id="detail-trailer-iframe"
                        allow="autoplay; encrypted-media; fullscreen; picture-in-picture"
                        allowfullscreen
                        frameborder="0">
                    </iframe>
                </div>
                <div class="detail-hero-bottom">
                    <h2 id="detail-title"></h2>
                    <div class="detail-tagline" id="detail-tagline"></div>
                    <div class="detail-actions">
                        <button id="detail-play" class="btn btn-primary">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                            Play
                        </button>
                        <button id="detail-add-list" class="btn btn-outline-circle" title="Add to My List" aria-label="Add to My List">
                            <svg id="detail-list-icon-add" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                            <svg id="detail-list-icon-check" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="display:none"><polyline points="20 6 9 17 4 12"></polyline></svg>
                        </button>
                        <!-- Trailer toggle button (only when trailer available) -->
                        <button id="detail-trailer-btn" class="btn btn-ghost detail-trailer-toggle" style="display:none" title="Watch Trailer">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"></polygon><rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect></svg>
                            Trailer
                        </button>
                    </div>
                </div>
            </div>

            <!-- Metadata bar -->
            <div class="detail-meta-bar" id="detail-meta-bar">
                <div class="detail-meta-left">
                    <span class="detail-rating" id="detail-rating"></span>
                    <span class="detail-year" id="detail-year"></span>
                    <span class="detail-runtime" id="detail-runtime"></span>
                </div>
                <div class="detail-genres" id="detail-genres"></div>
            </div>

            <!-- Overview -->
            <div class="detail-body">
                <p id="detail-desc" class="detail-overview"></p>
            </div>

            <!-- Cast row -->
            <div class="detail-section" id="detail-cast-section" style="display:none">
                <h4 class="detail-section-title">Cast</h4>
                <div class="detail-cast-row" id="detail-cast-row"></div>
            </div>

            <!-- Episodes section (TV only) -->
            <div class="detail-section detail-episodes-section" id="detail-episodes-section" style="display:none">
                <div class="detail-episodes-header">
                    <h4 class="detail-section-title">Episodes</h4>
                    <div class="detail-episodes-controls">
                        <div class="detail-season-select-wrap">
                            <select id="detail-season-select" class="detail-season-select" aria-label="Select season"></select>
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
                        </div>
                        <div class="detail-ep-search-wrap">
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                            <input type="text" id="detail-ep-search" class="detail-ep-search" placeholder="Search episode...">
                        </div>
                    </div>
                </div>
                <div class="detail-episode-list" id="detail-episode-list">
                    <div class="detail-ep-loading" id="detail-ep-loading">
                        <div class="detail-ep-spinner"></div>
                    </div>
                </div>
            </div>

            <!-- Related content -->
            <div class="detail-section" id="detail-related-section" style="display:none">
                <h4 class="detail-section-title">More Like This</h4>
                <div class="detail-related-row" id="detail-related-row"></div>
            </div>

        </div>
    </div>



    <!-- Netflix-Style Full-Screen Player -->
    <div id="player-modal" class="player-modal">
        <!-- Top control bar (auto-hides) -->
        <div class="player-controls-top" id="player-controls-top">
            <button class="player-back-btn" id="close-player">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
            </button>
            <div class="player-meta">
                <span class="player-logo">GSFLIX</span>
                <span class="player-separator">|</span>
                <span class="player-movie-title" id="player-movie-title">Loading…</span>
            </div>
            <div class="player-top-right">
                <!-- Next Episode (TV only) -->
                <button class="player-btn-tv" id="player-next-ep" title="Next Episode" style="display:none">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 4 15 12 5 20 5 4"></polygon><line x1="19" y1="5" x2="19" y2="19"></line></svg>
                    <span>Next</span>
                </button>
                <!-- Episodes Panel (TV only) -->
                <button class="player-btn-tv" id="player-ep-list-btn" title="Episodes" style="display:none">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
                    <span>Episodes</span>
                </button>
                <select id="player-server-select" class="player-server-select" title="Select Server">
                    <option value="vixsrc" selected>VixSrc</option>
                    <option value="vidking">VidKing</option>
                </select>
            </div>
        </div>

        <!-- Episode List Panel (slide in from right) -->
        <div class="player-ep-panel" id="player-ep-panel">
            <div class="player-ep-panel-header">
                <div class="player-ep-panel-title">Episodes</div>
                <select class="player-ep-season-select" id="player-ep-season-select"></select>
                <button class="player-ep-panel-close" id="player-ep-panel-close">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            <div class="player-ep-list" id="player-ep-list">
                <div class="player-ep-loading" id="player-ep-loading">
                    <div class="player-spinner" style="width:28px;height:28px;border-width:3px"></div>
                </div>
            </div>
        </div>

        <!-- The existing GSFlix player surface. VixSrc uses this video element; VidKing uses the iframe. -->
        <video id="vix-player" playsinline controls preload="auto"></video>
        <iframe id="vidking-player" allowfullscreen allow="autoplay; encrypted-media; fullscreen; picture-in-picture" style="display:none"></iframe>

        <!-- Loading spinner -->
        <div class="player-loader" id="player-loader">
            <div class="player-spinner"></div>
        </div>
    </div>

    <footer>
        <p>GSFlix Demo.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="/js/main.js"></script>
</body>
</html>
